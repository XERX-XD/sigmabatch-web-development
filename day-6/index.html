<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form </title>
</head>
<body>
    <h1>Form to Apply for Jobs</h1>
    <form action="post">
        <div>
            <label for="username">enter your username</label>
            <input type="text" name="username" id="username" placeholder="input your username" required autofocus>

        </div>
        <div>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" name="subscribe" id="subscribe">
            <label for="subscribe">Subscribe to Youtube</label>
        </div>
        <div>
            <label for="cmtt">enter your comments</label>
            <br>
            <textarea name="comment" id="cmtt"></textarea>
        </div>
        <div>
            <select name="fruits" id="fruits">

                <option value="app">Apple</option>
                <option value="man">mango</option>
                <option value="ban">banana</option>
            </select>

            
        </div>
    </form>
</body>
</html>
